<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Luna Ride | Penumpang</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    :root{--primary:#10b981;--primary-dark:#059669;--text-main:#1e293b;--text-muted:#64748b;--bg-gray:#f8fafc;--border:#e2e8f0;--danger:#ef4444}
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{height:100vh;overflow:hidden;background:#000}
    #auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;padding:20px}
    #auth-screen.hidden{display:none}
    .brand-container{text-align:center;margin-bottom:35px;width:100%;max-width:300px}.brand-title{color:#fff;font-size:36px;font-weight:700;letter-spacing:2px;margin-bottom:8px;animation:pulseGlow 2s infinite alternate}.car-track{position:relative;height:30px;border-bottom:2px dashed rgba(255,255,255,.3);overflow:hidden}.car-anim{position:absolute;bottom:2px;color:var(--primary);font-size:24px;animation:driveCar 3s linear infinite}
    @keyframes pulseGlow{from{text-shadow:0 0 10px rgba(16,185,129,.2)}to{text-shadow:0 0 22px rgba(16,185,129,.8)}}@keyframes driveCar{0%{left:-35px;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:100%;opacity:0}}
    .auth-card{width:100%;max-width:400px;background:#fff;padding:28px;border-radius:24px;box-shadow:0 15px 35px rgba(0,0,0,.25)}.auth-title{text-align:center;color:var(--text-main);margin-bottom:20px;font-size:22px;font-weight:700}.auth-input{width:100%;padding:14px 16px;background:var(--bg-gray);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;font-size:15px;outline:none}.auth-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(16,185,129,.1);background:#fff}.auth-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:5px}.auth-switch{text-align:center;margin-top:16px;font-size:14px;color:var(--text-muted)}.auth-switch span{color:var(--primary);font-weight:700;cursor:pointer}
    .app{height:100vh;display:flex;flex-direction:column;background:#fff}.topbar{background:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.08)}.topbar h3{color:var(--text-main);font-size:18px}.topbar button{border:none;background:#ecfdf5;color:var(--primary-dark);padding:8px 12px;border-radius:20px;font-weight:700;cursor:pointer}#map{flex:1;width:100%;z-index:1}
    .booking-panel{background:#fff;padding:16px;border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12);z-index:1000}.hint{font-size:13px;color:var(--text-muted);margin-bottom:12px;text-align:center}.field-row{display:flex;gap:8px;margin-bottom:10px}.field-row input{flex:1;padding:13px;border:1px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--bg-gray)}.field-row button{width:95px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}.order-btn{width:100%;padding:15px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}.info-box{background:#f1f5f9;border-radius:12px;padding:10px;font-size:13px;color:var(--text-muted);margin-top:8px;line-height:1.5}
  </style>
</head>
<body>
  <div id="auth-screen"><div class="brand-container"><div class="brand-title">LUNA RIDE</div><div class="car-track"><i class="fa-solid fa-car-side car-anim"></i></div></div><div class="auth-card"><h2 class="auth-title" id="authTitle">Masuk Akun</h2><input type="text" id="nameInput" class="auth-input" placeholder="Nama lengkap" style="display:none;"><input type="text" id="phoneInput" class="auth-input" placeholder="Nomor HP"><input type="password" id="passwordInput" class="auth-input" placeholder="Password"><button type="button" class="auth-btn" onclick="authAction()" id="authBtn">Masuk</button><div class="auth-switch"><span id="switchText">Belum punya akun?</span><span onclick="toggleAuth()" id="switchBtn"> Daftar</span></div></div></div>
  <div class="app"><div class="topbar"><h3><i class="fa-solid fa-location-dot" style="color:#10b981;"></i> Luna Ride</h3><button type="button" onclick="centerToAsal()"><i class="fa-solid fa-crosshairs"></i> Lokasi</button></div><div id="map"></div><div class="booking-panel"><div class="hint" id="hintText">Klik tombol Asal/Tujuan, lalu klik titik di map.</div><div class="field-row"><input id="pickup" placeholder="Lokasi asal" readonly><button type="button" onclick="pilihAsal()">Asal</button></div><div class="field-row"><input id="destination" placeholder="Lokasi tujuan" readonly><button type="button" onclick="pilihTujuan()">Tujuan</button></div><button type="button" class="order-btn" onclick="pesanRide()"><i class="fa-solid fa-motorcycle"></i> Pesan Sekarang</button><div class="info-box" id="infoBox">Lokasi asal otomatis dari GPS. Bisa diubah manual dengan klik tombol Asal lalu klik map.</div></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let isRegister=false,map,asalMarker,tujuanMarker,asalLatLng=null,tujuanLatLng=null,modePilih="asal",watchId=null,mapStarted=false;
    let userData={name:"",phone:""};
    function toggleAuth(){isRegister=!isRegister;document.getElementById("authTitle").innerText=isRegister?"Daftar Akun":"Masuk Akun";document.getElementById("authBtn").innerText=isRegister?"Daftar":"Masuk";document.getElementById("nameInput").style.display=isRegister?"block":"none";document.getElementById("switchText").innerText=isRegister?"Sudah punya akun?":"Belum punya akun?";document.getElementById("switchBtn").innerText=isRegister?" Masuk":" Daftar"}
    function authAction(){const phone=document.getElementById("phoneInput").value.trim();const password=document.getElementById("passwordInput").value.trim();const name=document.getElementById("nameInput").value.trim();if(isRegister&&name===""){alert("Nama lengkap wajib diisi");return}if(phone===""||password===""){alert("Nomor HP dan password wajib diisi");return}userData.name=isRegister?name:"Penumpang Luna";userData.phone=phone;document.getElementById("auth-screen").classList.add("hidden");setTimeout(()=>{if(!mapStarted){initMap();mapStarted=true}},300)}
    function initMap(){map=L.map("map").setView([-6.914744,107.609810],15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);map.on("click",e=>{if(modePilih==="asal"){setLokasiAsal(e.latlng.lat,e.latlng.lng,true)}else{setLokasiTujuan(e.latlng.lat,e.latlng.lng)}});mulaiPantauLokasi()}
    function mulaiPantauLokasi(){if(!navigator.geolocation){document.getElementById("infoBox").innerText="Browser tidak mendukung GPS.";return}watchId=navigator.geolocation.watchPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;if(!asalLatLng){setLokasiAsal(lat,lng,false);map.setView([lat,lng],17)}},error=>{let pesan="Gagal mengambil lokasi.";if(error.code===1)pesan="Izin lokasi ditolak. Aktifkan izin lokasi browser.";if(error.code===2)pesan="GPS/lokasi tidak tersedia.";if(error.code===3)pesan="Pengambilan lokasi terlalu lama.";document.getElementById("infoBox").innerText=pesan;console.log(error)},{enableHighAccuracy:true,maximumAge:0,timeout:10000})}
    function makeIcon(bg,icon){return L.divIcon({html:`<div style="width:38px;height:38px;background:${bg};color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid white;box-shadow:0 4px 12px rgba(0,0,0,.3);"><i class="fa-solid ${icon}"></i></div>`,className:"",iconSize:[38,38],iconAnchor:[19,19]})}
    function setLokasiAsal(lat,lng,manual){asalLatLng=[lat,lng];if(asalMarker){asalMarker.setLatLng(asalLatLng)}else{asalMarker=L.marker(asalLatLng,{icon:makeIcon("#10b981","fa-user")}).addTo(map)}asalMarker.bindPopup("Lokasi Asal").openPopup();document.getElementById("pickup").value=lat.toFixed(6)+", "+lng.toFixed(6);document.getElementById("infoBox").innerText=manual?"Lokasi asal berhasil diubah dari klik map.":"Lokasi asal otomatis dari GPS aktif.";tampilkanEstimasi()}
    function setLokasiTujuan(lat,lng){tujuanLatLng=[lat,lng];if(tujuanMarker){tujuanMarker.setLatLng(tujuanLatLng)}else{tujuanMarker=L.marker(tujuanLatLng,{icon:makeIcon("#ef4444","fa-flag-checkered")}).addTo(map)}tujuanMarker.bindPopup("Lokasi Tujuan").openPopup();document.getElementById("destination").value=lat.toFixed(6)+", "+lng.toFixed(6);document.getElementById("infoBox").innerText="Lokasi tujuan berhasil dipilih.";tampilkanEstimasi()}
    function pilihAsal(){modePilih="asal";document.getElementById("hintText").innerText="Mode pilih ASAL aktif. Klik titik asal di map.";document.getElementById("infoBox").innerText="Silakan klik lokasi asal pada map."}
    function pilihTujuan(){modePilih="tujuan";document.getElementById("hintText").innerText="Mode pilih TUJUAN aktif. Klik titik tujuan di map.";document.getElementById("infoBox").innerText="Silakan klik lokasi tujuan pada map."}
    function centerToAsal(){if(!map||!asalLatLng){alert("Lokasi asal belum tersedia.");return}map.setView(asalLatLng,17);asalMarker.openPopup()}
    function hitungJarakKm(asal,tujuan){const R=6371,dLat=(tujuan[0]-asal[0])*Math.PI/180,dLng=(tujuan[1]-asal[1])*Math.PI/180,lat1=asal[0]*Math.PI/180,lat2=tujuan[0]*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.sin(dLng/2)**2*Math.cos(lat1)*Math.cos(lat2);return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)))}
    function hitungTarif(jarakKm){const total=5000+(jarakKm*2500);return Math.round(Math.max(total,8000))}
    function formatRupiah(angka){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",minimumFractionDigits:0}).format(angka)}
    function tampilkanEstimasi(){if(!asalLatLng||!tujuanLatLng)return;const jarak=hitungJarakKm(asalLatLng,tujuanLatLng),tarif=hitungTarif(jarak);document.getElementById("infoBox").innerHTML=`Estimasi jarak: <b>${jarak.toFixed(2)} km</b><br>Estimasi tarif: <b>${formatRupiah(tarif)}</b>`}
    function pesanRide(){if(!asalLatLng){alert("Lokasi asal belum dipilih.");return}if(!tujuanLatLng){alert("Lokasi tujuan belum dipilih.");return}if(typeof window.kirimOrderKeFirebase!=="function"){alert("Firebase belum siap. Coba refresh halaman.");return}document.getElementById("infoBox").innerHTML="Mengirim pesanan ke driver...";window.kirimOrderKeFirebase(asalLatLng,tujuanLatLng,userData).then(orderId=>{const jarak=hitungJarakKm(asalLatLng,tujuanLatLng),tarif=hitungTarif(jarak);document.getElementById("infoBox").innerHTML=`<b>Pesanan berhasil dikirim!</b><br>Status: Menunggu driver.<br>Jarak: ${jarak.toFixed(2)} km<br>Tarif: ${formatRupiah(tarif)}<br>ID Order: ${orderId}`;if(typeof window.pantauStatusOrder==="function")window.pantauStatusOrder(orderId)}).catch(error=>{alert("Gagal kirim order: "+error.message);document.getElementById("infoBox").innerText="Pesanan gagal dikirim."})}
    window.addEventListener("beforeunload",()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId)})
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    const firebaseConfig={apiKey:"AIzaSyAPmHTjD7HvqQALbegPVBDEE8utz6wqb7o",authDomain:"luna-ride-projek.firebaseapp.com",databaseURL:"https://luna-ride-projek-default-rtdb.asia-southeast1.firebasedatabase.app/",projectId:"luna-ride-projek",storageBucket:"luna-ride-projek.firebasestorage.app",messagingSenderId:"350029772655",appId:"1:350029772655:web:5da8abdc58810dac3f5a9a"};
    const app=initializeApp(firebaseConfig);const db=getDatabase(app);
    function hitungJarakKmFirebase(asal,tujuan){const R=6371,dLat=(tujuan[0]-asal[0])*Math.PI/180,dLng=(tujuan[1]-asal[1])*Math.PI/180,lat1=asal[0]*Math.PI/180,lat2=tujuan[0]*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.sin(dLng/2)**2*Math.cos(lat1)*Math.cos(lat2);return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)))}
    function hitungTarifFirebase(jarakKm){return Math.round(Math.max(5000+(jarakKm*2500),8000))}
    function formatRupiahFirebase(angka){return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",minimumFractionDigits:0}).format(angka)}
    window.kirimOrderKeFirebase=function(asalLatLng,tujuanLatLng,userData){const orderRef=push(ref(db,"orders"));const jarak=hitungJarakKmFirebase(asalLatLng,tujuanLatLng);const tarif=hitungTarifFirebase(jarak);const dataOrder={customerName:userData.name||"Penumpang Luna",customerPhone:userData.phone||"-",asal:{lat:asalLatLng[0],lng:asalLatLng[1]},tujuan:{lat:tujuanLatLng[0],lng:tujuanLatLng[1]},jarakKm:jarak.toFixed(2),tarif:tarif,tarifText:formatRupiahFirebase(tarif),status:"menunggu_driver",driverId:"",createdAt:Date.now(),waktu:new Date().toLocaleString("id-ID")};return set(orderRef,dataOrder).then(()=>orderRef.key)};
    window.pantauStatusOrder=function(orderId){onValue(ref(db,"orders/"+orderId),snapshot=>{const order=snapshot.val();if(!order)return;if(order.status==="menunggu_driver"){document.getElementById("infoBox").innerHTML=`<b>Pesanan berhasil dikirim!</b><br>Status: Menunggu driver.<br>Jarak: ${order.jarakKm||"-"} km<br>Tarif: ${order.tarifText||"-"}`}if(order.status==="driver_menuju_penumpang"){document.getElementById("infoBox").innerHTML=`<b>Driver menerima pesanan!</b><br>Driver sedang menuju lokasi penjemputan.<br>Jarak: ${order.jarakKm||"-"} km<br>Tarif: ${order.tarifText||"-"}`}})};
  </script>
</body>
</html>
